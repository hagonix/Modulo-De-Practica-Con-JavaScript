<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
    <title>Ejemplo de con fecth</title>
</head>
<body>

    <div class="container" style='bacground-color: f0f0f0'>
        <h1>Publicaciones Recientes</h1>
        <button id="loadPostsBtn">cargar Publicaciones</button>
        <div id="posts-container">
             <p class="loading" id="loading-message" style="display:none;">Cargando Publicaciones</p>
             <div id="error-message" class="error" style='display: none;'></div>
             <input class="enviar" type="file">
        </div>
    </div>
    <script src="app1.js"></script>
    <script>
           document.addEventListener('DOMContentLoaded' ,()=>{
                const loadPostsBtn = document.getElementById('loadPostsBtn');
                const postsContainer = document.getElementById('posts-container');
                const loadingMessage = document.getElementById('loading-message');
                const errorMessage = document.getElementById('error-message');


                loadPostsBtn.addEventListener('click', fetchPosts);

                async function fetchPosts(){
                    loadingMessage.style.display = "block";
                    errorMessage.style.display = 'none';
                    postsContainer.innerHTML = ''; //limpiar publicaciones anteriores:

                    try{
                        const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                        //verificar si la respuesta fue exitosa;
                        if(!response.ok){
                            throw new Error(`Error HTTP: ${response.status} - ${response.statusText}`);
                        }
                            const posts = await response.json();
                        //Procesar los datos y mostrar en el DOM;
                        if(posts && posts.length > 0){
                            posts.forEach(post =>{
                                postElement = document.createElement('div');
                                postElement.classList.add('post');
                                postElement.innerHTML = `<h2>${post.title}</h2> <p>${post.body}</P>`;
                            postsContainer.appendChild(postElement);
                            })
                        }
                        else{
                            postsContainer.innerHTML = 'No se encontraron publicaciones'
                        }

                    }
                    catch(error){
                        //Manejo de errores
                        console.log('Hubo un problema con la operacion fecth:', error);
                        errorMessage.textContent = `No se pudieron cargar las publicaciones: ${error.message}.Por favor intente de nuevo mas tarde`;
                        errorMessage.style.display = 'block';
                    }
                    finally{
                        //Ocultar el mensaje de carga una vez que la operacion haya terminado(exito o error);
                        loadingMessage.style.display = 'none'
                    }
                }
              }
           );

    </script>
</body>
</html>
